<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h2>AI<span>Writer</span></h2>
        <a href="../index.html">Home</a>
    </header>
    <main class="container">
        <div class="heading">
            <p>AI CONTENT GENERATOR</p>
            <h1>Turn your ideas into content.</h1>
            <span>Create posts, emails, descriptions and more.</span>
        </div>
        <section class="generator">
            <div class="controls">
                <label for="prompt">Your prompt</label>
                <textarea id="prompt" placeholder="Write a LinkedIn post about AI..."></textarea>
                <label for="tone">Choose tone</label>
                <select id="tone">
                    <option>Professional</option>
                    <option>Friendly</option>
                    <option>Creative</option>
                    <option>Simple</option>
                </select>
                <button onclick="generateContent()">Generate Content</button>
            </div>
            <div class="result">
                <div class="result-head">
                    <h2>Generated Content</h2>
                    <button onclick="copyContent()">Copy</button>
                </div>
                <div id="output">
                    Your generated content will appear here.
                </div>
                <p id="stats">0 words</p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
